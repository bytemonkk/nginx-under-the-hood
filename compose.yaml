services:
  server-1:
    build: ./server
    environment:
      INSTANCE_ID: backend-1

  server-2:
    build: ./server
    environment:
      INSTANCE_ID: backend-2

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server-1
      - server-2