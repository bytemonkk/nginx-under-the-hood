<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nginx Under the Hood</title>
</head>
<body>
    <h1>Nginx Under the Hood</h1>

    <button onclick="getMessage()">Call Server</button>

    <p id="output"></p>

    <script>
        async function getMessage() {
            const response = await fetch("http://127.0.0.1:3001/api/message");
            const data = await response.json();

            document.getElementById("output").textContent = data.message;
        }
    </script>
</body>
</html>
